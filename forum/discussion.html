<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>查看讨论</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="discussion-page">
    <main class="discussion-page-shell">
      <a
        class="discussion-back-link"
        href="./index.html"
      >
        ← 返回论坛
      </a>

      <p
        class="discussion-status"
        id="discussionStatus"
      >
        正在加载讨论……
      </p>

      <article
        class="discussion-detail"
        id="discussionDetail"
        hidden
      >
        <header class="discussion-detail-header">
          <h1 id="discussionTitle"></h1>

          <div class="discussion-detail-meta">
            <span id="discussionAuthor"></span>

            <time id="discussionTime"></time>
          </div>

          <div
            class="forum-post-tags"
            id="discussionTags"
          ></div>
        </header>

        <div
          class="discussion-detail-content markdown-body"
          id="discussionContent"
        ></div>
      </article>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../site-cloud-helper.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    
    <script src="./discussion.js"></script>
  </body>
</html>
