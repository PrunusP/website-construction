<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>查看讨论</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="discussion-page">
    <main class="discussion-page-shell">
      <a
        class="discussion-back-link"
        href="./index.html"
      >
        ← 返回论坛
      </a>

      <p
        class="discussion-status"
        id="discussionStatus"
      >
        正在加载讨论……
      </p>

      <article
        class="discussion-detail"
        id="discussionDetail"
        hidden
      >
        <header class="discussion-detail-header">
          <h1 id="discussionTitle"></h1>

          <div class="discussion-detail-meta">
            <span id="discussionAuthor"></span>

            <time id="discussionTime"></time>
          </div>

          <div
            class="forum-post-tags"
            id="discussionTags"
          ></div>
        </header>

        <div
          class="discussion-detail-content markdown-body"
          id="discussionContent"
        ></div>

        <div
          class="discussion-owner-actions"
          id="ownerActions"
          hidden
        >
            <button id="editPostButton" type="button">
            编辑帖子
          </button>

          <button
            id="deletePostButton"
            class="danger-button"
            type="button"
          >
            删除帖子
          </button>
        </div>
      </article>

      <section
  class="discussion-replies"
  aria-labelledby="repliesTitle"
>
  <header class="discussion-replies-header">
  <div>
    <p class="eyebrow">
      REPLIES
    </p>

    <h2 id="repliesTitle">
      回复
    </h2>
  </div>

  <div class="reply-header-actions">
    <span id="replyCount">
      0 条回复
    </span>

    <button
      class="open-reply-button"
      id="openReplyButton"
      type="button"
      aria-controls="replyComposer"
      aria-expanded="false"
    >
      回复
    </button>
  </div>
</header>

  <!-- 回复列表 -->
  <div
    class="reply-list"
    id="replyList"
  >
    <p class="reply-status">
      正在加载回复……
    </p>
  </div>

</section>
    </main>

    <!-- 回复抽屉背景 -->
<div
  class="reply-composer-backdrop"
  id="replyComposerBackdrop"
  aria-hidden="true"
  hidden
></div>


<!-- 屏幕底部回复抽屉 -->
<aside
  class="reply-composer"
  id="replyComposer"
  role="dialog"
  aria-modal="true"
  aria-labelledby="replyComposerTitle"
  aria-hidden="true"
  hidden
>
  <div class="reply-composer-handle"></div>

  <header class="reply-composer-header">
    <div>
      <p class="eyebrow">
        WRITE A REPLY
      </p>

      <h2 id="replyComposerTitle">
        发表回复
      </h2>
    </div>

    <button
      class="close-reply-button"
      id="closeReplyButton"
      type="button"
      aria-label="关闭回复框"
      title="关闭"
    >
      ×
    </button>
  </header>

  <form
    class="reply-form"
    id="replyForm"
    novalidate
  >
    <label for="replyContentInput">
      回复内容
    </label>

    <textarea
      id="replyContentInput"
      name="content"
      minlength="1"
      maxlength="3000"
      rows="7"
      placeholder="写下你的回复……"
      required
    ></textarea>

    <section class="reply-preview-panel">
  <h3>预览</h3>

  <div
    class="reply-markdown-preview markdown-body"
    id="replyMarkdownPreview"
  >
    <p class="markdown-preview-empty">
      Markdown 预览会显示在这里
    </p>
  </div>
</section>

    <div class="reply-form-footer">
      <p
        class="reply-message"
        id="replyMessage"
        role="status"
        aria-live="polite"
      ></p>

      <div class="reply-form-actions">
        <button
          class="reply-cancel-button"
          id="cancelReplyButton"
          type="button"
        >
          取消
        </button>

        <button
          class="reply-submit-button"
          id="replySubmitButton"
          type="submit"
        >
          提交回复
        </button>
      </div>
    </div>
  </form>
</aside>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../site-cloud-helper.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    
    <script src="./discussion.js"></script>
  </body>
</html>
