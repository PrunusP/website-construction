<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>论坛</title>

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="forum-page">
    <nav class="forum-shell">
      <header class="forum-hero">
        <p class="eyebrow">COMMUNITY</p>
        <h1>欢迎来到论坛</h1>

        <p class="forum-description">
          在这里分享想法、提出问题，并参与社区讨论。
        </p>
      </header>

      <!-- 网站导航 -->
      <section class="forum-sections" aria-label="论坛区域">
        <a class="forum-section-card" href="#physics">

          <div>
            <h2>物理区</h2>
            <p>提出疑问，解答疑问，或发表题解</p>
          </div>

          <span class="forum-card-arrow" aria-hidden="true">
            ›
          </span>
        </a>

      </section>
    </nav>




    <!-- 不同的论坛区域 -->

<main class="forum-zone">
  <!-- 物理区 -->
  <section class="forum-subject" id="physics">
    <header class="forum-subject-header">

      <div>
        <h2>物理区</h2>
        <p>欢迎来到物理区 👏</p>
      </div>
    </header>

    <div class="forum-subject-content">
      <p>
        在这里提出物理问题、分享解题方法，
        或者参与其他用户的讨论。
      </p>

    </div>

    <!-- 物理区帖子会放在这里 -->
    <div
        class="forum-post-list"
        id="physicsPostList"
    >
        <p class="forum-post-loading">
        正在加载物理区帖子……
        </p>
    </div>
  </section>

</main>




    <!-- 右侧抽屉 -->
    <aside
      class="forum-drawer"
      id="forumDrawer"
      aria-label="论坛导航"
    >
      <!-- 侧栏把手 -->
      <button
        class="forum-drawer-handle"
        id="drawerButton"
        type="button"
        aria-label="打开论坛导航"
        aria-expanded="false"
        aria-controls="drawerContent"
      >
        <span aria-hidden="true">‹</span>
      </button>

      <div
        class="forum-drawer-content"
        id="drawerContent"
      >
        <div class="forum-user">
          <span class="forum-user-label">
            当前账号
          </span>

          <!-- 用户邮箱由 JavaScript 写入 -->
          <strong id="userGreeting">
            Hi, 正在读取……
          </strong>
        </div>

        <a
          class="forum-start-button"
          id="startDiscussionButton"
          href="./new_discussion.html"
        >
          <span>Start a discussion</span>
          <span aria-hidden="true">＋</span>
        </a>

        <nav
          class="forum-drawer-navigation"
          aria-label="前往不同区域"
        >
          <span class="forum-navigation-title">
            论坛区域
          </span>

          <a href="#physics">
            <span>物理区</span>
          </a>
        </nav>

        <a class="forum-home-button" href="../index.html">
          <span aria-hidden="true">←</span>
          <span>返回首页</span>
        </a>
      </div>
    </aside>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../site-cloud-helper.js"></script>

    <script>
      const forumDrawer =
        document.getElementById("forumDrawer");

      const drawerButton =
        document.getElementById("drawerButton");

      const userGreeting =
        document.getElementById("userGreeting");

      const startDiscussionButton =
        document.getElementById(
          "startDiscussionButton"
        );

      function setDrawerOpen(isOpen) {
        forumDrawer.classList.toggle(
          "is-open",
          isOpen
        );

        drawerButton.setAttribute(
          "aria-expanded",
          String(isOpen)
        );

        drawerButton.setAttribute(
          "aria-label",
          isOpen
            ? "关闭论坛导航"
            : "打开论坛导航"
        );

        drawerButton
          .querySelector("span")
          .textContent = isOpen ? "›" : "‹";
      }

      // 点击右侧把手时切换打开状态
      drawerButton.addEventListener(
        "click",
        function () {
          const isOpen =
            forumDrawer.classList.contains(
              "is-open"
            );

          setDrawerOpen(!isOpen);
        }
      );

      // 点击侧栏外面时关闭侧栏
      document.addEventListener(
        "pointerdown",
        function (event) {
          if (
            forumDrawer.classList.contains(
              "is-open"
            ) &&
            !forumDrawer.contains(event.target)
          ) {
            setDrawerOpen(false);
          }
        }
      );

      // 按 Escape 键关闭侧栏
      document.addEventListener(
        "keydown",
        function (event) {
          if (event.key === "Escape") {
            setDrawerOpen(false);
            drawerButton.focus();
          }
        }
      );

      async function loadCurrentUser() {
        try {
          const {
            data: { user },
            error
          } =
            await window.siteSupabase.auth.getUser();

          if (error) {
            throw error;
          }

          if (!user) {
            userGreeting.textContent =
              "Hi, 访客";

            /*
             * 未登录时，点击发起讨论按钮会前往登录页。
             */
            startDiscussionButton.href =
              "../login.html";

            startDiscussionButton
              .querySelector("span")
              .textContent = "登录后发起讨论";

            return;
          }

          /*
           * 使用 textContent 写入邮箱，
           * 不使用 innerHTML，避免把邮箱当作 HTML 解析。
           */
          userGreeting.textContent =
            `Hi, ${user.email ?? "用户"}`;
        } catch (error) {
          console.error(
            "读取论坛用户失败：",
            error
          );

          userGreeting.textContent =
            "Hi, 访客";

          startDiscussionButton.href =
            "../login.html";

          startDiscussionButton
            .querySelector("span")
            .textContent = "登录后发起讨论";
        }
      }

      loadCurrentUser();
    </script>
  

<script>
  /*
   * 数据库 category 值和 HTML 容器的对应关系。
   */
  const categoryContainers = {
    physics: document.getElementById(
      "physicsPostList"
    ),
  };

  /*
   * 数据库标签值与中文名称的对应关系。
   */
  const tagNames = {
    unsolved: "未解决",
    solved: "已解决",
    Physics1: "AP Physics 1",
    Physics2: "AP Physics 2",
    PhysicsC: "AP Physics C",
    solution: "题解",
    other: "其他"

  };

  async function loadForumPosts() {
    /*
     * 先清空所有区域中的“正在加载”文字。
     */
    for (
      const container
      of Object.values(categoryContainers)
    ) {
      if (container) {
        container.replaceChildren();
      }
    }

    try {
      const { data: posts, error } =
        await window.siteSupabase
          .from("posts")
          .select(`
            post_id,
            author_id,
            title,
            category,
            tags,
            content,
            created_at
          `)
          .order("created_at", {
            ascending: false
          })
          .limit(100);

      if (error) {
        throw error;
      }

      /*
       * 把每个帖子放到它所属的区域中。
       */
      for (const post of posts) {
        const targetContainer =//储存目标区域的id
          categoryContainers[post.category];

        /*
         * 如果数据库中的 category 不在我们定义的
         * 区域中，就暂时跳过这个帖子。
         */
        if (!targetContainer) {
          console.warn(
            "未知的帖子区域：",
            post.category,
            post
          );

          continue;
        }

        const postElement =
          createPostElement(post);

        targetContainer.append(postElement);
      }

      showEmptyCategoryMessages();
    } catch (error) {
      console.error("加载帖子失败：", error);

      for (
        const container
        of Object.values(categoryContainers)
      ) {
        if (!container) {
          continue;
        }

        const errorMessage =
          document.createElement("p");

        errorMessage.className =
          "forum-post-empty";

        errorMessage.textContent =
          "帖子加载失败，请稍后重试。";

        container.append(errorMessage);
      }
    }
  }

  /*
   * 根据一条数据库记录创建帖子 HTML。
   */
  function createPostElement(post) {
    const card =
      document.createElement("a");

    card.className = "forum-post-card";

    card.href =
    `./discussion.html?id=${encodeURIComponent(
      post.id
    )}`;

    const heading =
      document.createElement("div");

    heading.className = "forum-post-heading";

    const title =
      document.createElement("h3");

    /*
     * 使用 textContent，避免帖子内容被当成 HTML 执行。
     */
    title.textContent = post.title || "无标题讨论";

    const time =
      document.createElement("time");

    time.className = "forum-post-time";

    const createdDate =
      new Date(post.created_at);

    time.dateTime = post.created_at;

    time.textContent =
      createdDate.toLocaleString("zh-CN", {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });

    heading.append(title, time);

    const tagsContainer =
      document.createElement("div");

    tagsContainer.className = "forum-post-tags";

    for (const tag of post.tags ?? []) {
      const tagElement =
        document.createElement("span");

      tagElement.textContent =
        tagNames[tag] ?? tag;
//tagElement.className = "forum-post-tags-names"
      tagsContainer.append(tagElement);
    }

    const footer =
      document.createElement("footer");

    footer.className = "forum-post-footer";

    const author =
      document.createElement("span");

    /*
     * 目前数据库没有公开用户邮箱，
     * 因此先显示用户 UUID 的前八位。
     */
    const shortAuthorId =
        post.author_id?.slice(0, 8) ?? "未知";

    author.textContent =
        `用户 ${shortAuthorId}`;

    const openText =
        document.createElement("span");

    openText.className = "forum-post-open";
    openText.textContent = "查看讨论 ›";

    footer.append(author, openText);

    card.append(
      heading,
      tagsContainer,
      footer
    );

    return card;
  }
  
  /*
   * 如果某个区域没有帖子，显示空状态。
   */
  function showEmptyCategoryMessages() {
    for (
      const [category, container]
      of Object.entries(categoryContainers)
    ) {
      if (!container || container.children.length > 0) {
        continue;
      }

      const emptyMessage =
        document.createElement("p");

      emptyMessage.className =
        "forum-post-empty";

      emptyMessage.textContent =
        "这个区域暂时还没有讨论。";

      container.append(emptyMessage);
    }
  }

  loadForumPosts();
</script>

</body>
</html>
