<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>论坛</title>

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="forum-page">
    <nav class="forum-shell">
      <header class="forum-hero">
        <p class="eyebrow">COMMUNITY</p>
        <h1>欢迎来到论坛</h1>

        <p class="forum-description">
          在这里分享想法、提出问题，并参与社区讨论。
        </p>
      </header>

      <!-- 网站导航 -->
      <section class="forum-sections" aria-label="论坛区域">
        <a class="forum-section-card" href="#physics">

          <div>
            <h2>物理区</h2>
            <p>提出疑问，解答疑问，或发表题解</p>
          </div>

          <span class="forum-card-arrow" aria-hidden="true">
            ›
          </span>
        </a>

      </section>
    </nav>

    <!-- 不同的论坛区域 -->

<main class="forum-zone">
  <!-- 物理区 -->
  <section class="forum-subject" id="physics">
    <header class="forum-subject-header">

      <div>
        <h2>物理区</h2>
        <p>欢迎来到物理区 👏</p>
      </div>
    </header>

    <div class="forum-subject-content">
      <p>
        在这里提出物理问题、分享解题方法，
        或者参与其他用户的讨论。
      </p>

    </div>
  </section>
  
</main>

    <!-- 右侧抽屉 -->
    <aside
      class="forum-drawer"
      id="forumDrawer"
      aria-label="论坛导航"
    >
      <!-- 侧栏把手 -->
      <button
        class="forum-drawer-handle"
        id="drawerButton"
        type="button"
        aria-label="打开论坛导航"
        aria-expanded="false"
        aria-controls="drawerContent"
      >
        <span aria-hidden="true">‹</span>
      </button>

      <div
        class="forum-drawer-content"
        id="drawerContent"
      >
        <div class="forum-user">
          <span class="forum-user-label">
            当前账号
          </span>

          <!-- 用户邮箱由 JavaScript 写入 -->
          <strong id="userGreeting">
            Hi, 正在读取……
          </strong>
        </div>

        <a
          class="forum-start-button"
          id="startDiscussionButton"
          href="./new_discussion.html"
        >
          <span>Start a discussion</span>
          <span aria-hidden="true">＋</span>
        </a>

        <nav
          class="forum-drawer-navigation"
          aria-label="前往不同区域"
        >
          <span class="forum-navigation-title">
            论坛区域
          </span>

          <a href="#physics">
            <span>物理区</span>
          </a>
        </nav>

        <a class="forum-home-button" href="../index.html">
          <span aria-hidden="true">←</span>
          <span>返回首页</span>
        </a>
      </div>
    </aside>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../site-cloud-helper.js"></script>

    <script>
      const forumDrawer =
        document.getElementById("forumDrawer");

      const drawerButton =
        document.getElementById("drawerButton");

      const userGreeting =
        document.getElementById("userGreeting");

      const startDiscussionButton =
        document.getElementById(
          "startDiscussionButton"
        );

      function setDrawerOpen(isOpen) {
        forumDrawer.classList.toggle(
          "is-open",
          isOpen
        );

        drawerButton.setAttribute(
          "aria-expanded",
          String(isOpen)
        );

        drawerButton.setAttribute(
          "aria-label",
          isOpen
            ? "关闭论坛导航"
            : "打开论坛导航"
        );

        drawerButton
          .querySelector("span")
          .textContent = isOpen ? "›" : "‹";
      }

      // 点击右侧把手时切换打开状态
      drawerButton.addEventListener(
        "click",
        function () {
          const isOpen =
            forumDrawer.classList.contains(
              "is-open"
            );

          setDrawerOpen(!isOpen);
        }
      );

      // 点击侧栏外面时关闭侧栏
      document.addEventListener(
        "pointerdown",
        function (event) {
          if (
            forumDrawer.classList.contains(
              "is-open"
            ) &&
            !forumDrawer.contains(event.target)
          ) {
            setDrawerOpen(false);
          }
        }
      );

      // 按 Escape 键关闭侧栏
      document.addEventListener(
        "keydown",
        function (event) {
          if (event.key === "Escape") {
            setDrawerOpen(false);
            drawerButton.focus();
          }
        }
      );

      async function loadCurrentUser() {
        try {
          const {
            data: { user },
            error
          } =
            await window.siteSupabase.auth.getUser();

          if (error) {
            throw error;
          }

          if (!user) {
            userGreeting.textContent =
              "Hi, 访客";

            /*
             * 未登录时，点击发起讨论按钮会前往登录页。
             */
            startDiscussionButton.href =
              "../login.html";

            startDiscussionButton
              .querySelector("span")
              .textContent = "登录后发起讨论";

            return;
          }

          /*
           * 使用 textContent 写入邮箱，
           * 不使用 innerHTML，避免把邮箱当作 HTML 解析。
           */
          userGreeting.textContent =
            `Hi, ${user.email ?? "用户"}`;
        } catch (error) {
          console.error(
            "读取论坛用户失败：",
            error
          );

          userGreeting.textContent =
            "Hi, 访客";

          startDiscussionButton.href =
            "../login.html";

          startDiscussionButton
            .querySelector("span")
            .textContent = "登录后发起讨论";
        }
      }

      loadCurrentUser();
    </script>
  </body>
</html>
