<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>论坛</title>

    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="forum-page">
    <nav class="forum-shell">
      <header class="forum-hero">
        <p class="eyebrow">COMMUNITY</p>
        <h1>欢迎来到论坛</h1>

        <p class="forum-description">
          在这里分享想法、提出问题，并参与社区讨论。
        </p>
      </header>

      <!-- 网站导航 -->
      <section class="forum-sections" aria-label="论坛区域">
        <a class="forum-section-card" href="#physics">

          <div>
            <h2>物理区</h2>
            <p>提出疑问，解答疑问，或发表题解</p>
          </div>

          <span class="forum-card-arrow" aria-hidden="true">
            ›
          </span>
        </a>

      </section>
    </nav>




    <!-- 不同的论坛区域 -->

<main class="forum-zone">
  <!-- 物理区 -->
  <section class="forum-subject" id="physics">
    <header class="forum-subject-header">

      <div>
        <h2>物理区</h2>
        <p>欢迎来到物理区 👏</p>
      </div>
    </header>

    <div class="forum-subject-content">
      <p>
        在这里提出物理问题、分享解题方法，
        或者参与其他用户的讨论。
      </p>

    </div>

    <!-- 物理区帖子会放在这里 -->
    <div
        class="forum-post-list"
        id="physicsPostList"
    >
        <p class="forum-post-loading">
        正在加载物理区帖子……
        </p>
    </div>
  </section>

  <!-- 文学区 -->
  <section class="forum-subject" id="literature">
    <header class="forum-subject-header">

      <div>
        <h2>文学区</h2>
        <p>欢迎来到文学区，嗨喽嗨喽</p>
      </div>
    </header>

    <div class="forum-subject-content">
      <p>
        在这里分享你的写作，发表你的见解，提出问题，或者参与其他用户的讨论。
      </p>

    </div>

    <!-- 文学区区帖子会放在这里 -->
    <div
        class="forum-post-list"
        id="literaturePostList"
    >
        <p class="forum-post-loading">
        正在加载文学区区帖子……
        </p>
    </div>
  </section>

</main>




    <!-- 右侧抽屉 -->
    <aside
      class="forum-drawer"
      id="forumDrawer"
      aria-label="论坛导航"
    >
      <!-- 侧栏把手 -->
      <button
        class="forum-drawer-handle"
        id="drawerButton"
        type="button"
        aria-label="打开论坛导航"
        aria-expanded="false"
        aria-controls="drawerContent"
      >
        <span aria-hidden="true">‹</span>
      </button>

      <div
        class="forum-drawer-content"
        id="drawerContent"
      >
        <div class="forum-user">
          <span class="forum-user-label">
            当前账号
          </span>

          <!-- 用户邮箱由 JavaScript 写入 -->
          <strong id="userGreeting">
            Hi, 正在读取……
          </strong>
        </div>

        <a
          class="forum-start-button"
          id="startDiscussionButton"
          href="./new_discussion.html"
        >
          <span>Start a discussion</span>
          <span aria-hidden="true">＋</span>
        </a>

        <nav
          class="forum-drawer-navigation"
          aria-label="前往不同区域"
        >
          <span class="forum-navigation-title">
            论坛区域
          </span>

          <a href="#physics">
            <span>物理区</span>
          </a>
        </nav>

        <a class="forum-home-button" href="../index.html">
          <span aria-hidden="true">←</span>
          <span>返回首页</span>
        </a>
      </div>
    </aside>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../site-cloud-helper.js"></script>

    <script src="./index.js"></script>>

</body>
</html>
