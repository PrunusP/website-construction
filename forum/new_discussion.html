<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>发起讨论</title>

    <!-- 当前文件位于 forum 文件夹中 -->
    <link rel="stylesheet" href="./styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css"
    />
  </head>

  <body class="discussion-editor-page">
    <main class="discussion-editor-shell">
      <header class="discussion-editor-header">
        <p class="eyebrow">NEW DISCUSSION</p>
        <h1>发起讨论</h1>

        <p>
          选择正确的区域和标签，可以让其他用户更容易找到你的讨论。
        </p>
      </header>

      <form
        class="discussion-form"
        id="discussionForm"
        novalidate
      >
        <!-- 标题 -->
        <label class="discussion-field">
          <span>Title</span>

          <input
            id="titleInput"
            name="title"
            type="text"
            minlength="4"
            maxlength="120"
            placeholder="用一句话描述你想讨论的内容"
            required
          />

          <small>
            标题长度为 4～120 个字符
          </small>
        </label>

        <!-- 区域 -->
        <label class="discussion-field">
          <span>区域</span>

          <select
            id="categorySelect"
            name="category"
            required
          >
            <option value="">
              请选择一个区域
            </option>

            <option value="computer">
              计算机区
            </option>

            <option value="physics">
              物理区
            </option>

            <option value="literature">
              文学区
            </option>

            <option value="chat">
              聊天区
            </option>
          </select>
        </label>

        <!-- 标签 -->
        <fieldset
          class="discussion-tags-field"
          id="tagsField"
          disabled
        >
          <legend>Tags</legend>

          <p id="tagsHelp">
            请先选择一个区域
          </p>

          <!-- JavaScript 会在这里生成标签 -->
          <div
            class="discussion-tags"
            id="tagsContainer"
          ></div>
        </fieldset>

        <!-- 正文 -->
         
        <label class="discussion-field">
         
          <span>讨论内容（支持 Markdown）</span>

          <textarea
            id="contentInput"
            name="content"
            minlength="10"
            maxlength="10000"
            rows="14"
            placeholder="Write a Post"

            required
          ></textarea>

          <small id="contentLengthMessage">
            至少 10 个字符，最多 10000 个字符
          </small>
        </label>

        <section class="markdown-preview-panel">
          <h2>预览</h2>

          <div
            class="markdown-body"
            id="markdownPreview"
          >
            <p class="markdown-preview-empty">
              Markdown 预览会显示在这里
            </p>
          </div>
        </section>

        <p
          class="discussion-message"
          id="discussionMessage"
          role="status"
          aria-live="polite"
        ></p>

        <div class="discussion-actions">
          <a
            class="discussion-cancel-button"
            href="./index.html"
          >
            取消并返回
          </a>

          <button
            class="discussion-submit-button"
            id="submitButton"
            type="submit"
          >
            提交讨论
          </button>
        </div>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../site-cloud-helper.js"></script>

     <!-- Markdown 转换器 -->
<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>

<!-- 防止 Markdown 中夹带危险 HTML -->
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<!-- 数学公式 -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.js"></script>

<!-- KaTeX 自动渲染扩展 -->
<script src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/contrib/auto-render.min.js"></script>

    <script src="./new_discussion.js"></script>
  </body>
</html>
