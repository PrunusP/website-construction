<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>发起讨论</title>

    <!-- 当前文件位于 forum 文件夹中 -->
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="discussion-editor-page">
    <main class="discussion-editor-shell">
      <header class="discussion-editor-header">
        <p class="eyebrow">NEW DISCUSSION</p>
        <h1>发起讨论</h1>

        <p>
          选择正确的区域和标签，可以让其他用户更容易找到你的讨论。
        </p>
      </header>

      <form
        class="discussion-form"
        id="discussionForm"
      >
        <!-- 标题 -->
        <label class="discussion-field">
          <span>Title</span>

          <input
            id="titleInput"
            name="title"
            type="text"
            minlength="4"
            maxlength="120"
            placeholder="用一句话描述你想讨论的内容"
            required
          />

          <small>
            标题长度为 4～120 个字符
          </small>
        </label>

        <!-- 区域 -->
        <label class="discussion-field">
          <span>区域</span>

          <select
            id="categorySelect"
            name="category"
            required
          >
            <option value="">
              请选择一个区域
            </option>

            <option value="physics">
              物理区
            </option>

          </select>
        </label>

        <!-- 标签 -->
        <fieldset
          class="discussion-tags-field"
          id="tagsField"
          disabled
        >
          <legend>Tags</legend>

          <p id="tagsHelp">
            请先选择一个区域
          </p>

          <!-- JavaScript 会在这里生成标签 -->
          <div
            class="discussion-tags"
            id="tagsContainer"
          ></div>
        </fieldset>

        <!-- 正文 -->
        <label class="discussion-field">
          <span>讨论内容（支持 Markdown）</span>

          <textarea
            id="contentInput"
            name="content"
            minlength="10"
            maxlength="10000"
            rows="14"
            placeholder="Write a Post"

            required
          ></textarea>

          <small>
            最多10000个字符
          </small>
        </label>

        <section class="markdown-preview-panel">
          <h2>预览</h2>

          <div
            class="markdown-body"
            id="markdownPreview"
          >
            <p class="markdown-preview-empty">
              Markdown 预览会显示在这里
            </p>
          </div>
        </section>

        <p
          class="discussion-message"
          id="discussionMessage"
          role="status"
          aria-live="polite"
        ></p>

        <div class="discussion-actions">
          <a
            class="discussion-cancel-button"
            href="./index.html"
          >
            取消并返回
          </a>

          <button
            class="discussion-submit-button"
            id="submitButton"
            type="submit"
          >
            提交讨论
          </button>
        </div>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../site-cloud-helper.js"></script>

     <!-- Markdown 转换器 -->
<script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>

<!-- 防止 Markdown 中夹带危险 HTML -->
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

    <script>
      /*
       * 每个区域允许使用的固定标签。
       *
       * 左边是数据库保存的值，
       * 右边是展示给用户的中文。
       */
      const tagsByCategory = {
        physics: [
          { value: "unsolved", label: "未解决" },
          { value: "solved", label: "已解决" },
          { value: "Physics1", label: "AP Physics 1" },
          { value: "Physics2", label: "AP Physics 2" },
          { value: "PhysicsC", label: "AP Physics C" },
          { value: "solution", label: "题解" },
          { value: "other", label: "其他" }
        ],
        
      };

      const discussionForm =
        document.getElementById("discussionForm");

      const titleInput =
        document.getElementById("titleInput");

      const categorySelect =
        document.getElementById("categorySelect");

      const tagsField =
        document.getElementById("tagsField");

      const tagsContainer =
        document.getElementById("tagsContainer");

      const tagsHelp =
        document.getElementById("tagsHelp");

      const contentInput =
        document.getElementById("contentInput");

      const discussionMessage =
        document.getElementById(
          "discussionMessage"
        );

      const submitButton =
        document.getElementById("submitButton");

        const markdownPreview =
          document.getElementById("markdownPreview");


        const contentLengthMessage =
          document.getElementById(
            "contentLengthMessage"
          );

        

      /*
       * 用户选择区域后重新生成标签。
       */
      categorySelect.addEventListener(
        "change",
        function () {
          const category = categorySelect.value;
          const availableTags =
            tagsByCategory[category] ?? [];

          tagsContainer.replaceChildren();

          if (availableTags.length === 0) {
            tagsField.disabled = true;
            tagsHelp.textContent =
              "请先选择一个区域";
            return;
          }

          tagsField.disabled = false;
          tagsHelp.textContent =
            "请选择 1～3 个标签";

          for (const tag of availableTags) {
            const label =
              document.createElement("label");

            label.className =
              "discussion-tag-option";

            const input =
              document.createElement("input");

            input.type = "checkbox";
            input.name = "tags";
            input.value = tag.value;

            const text =
              document.createElement("span");

            text.textContent = tag.label;

            label.append(input, text);
            tagsContainer.append(label);
          }
        }
      );

      /*
       * 最多只能选三个标签。
       */
      tagsContainer.addEventListener(
        "change",
        function (event) {
          const selectedTags = getSelectedTags();

          if (selectedTags.length > 3) {
            event.target.checked = false;

            discussionMessage.textContent =
              "最多只能选择 3 个标签。";
          } else {
            discussionMessage.textContent = "";
          }
        }
      );

      function getSelectedTags() {
        return Array.from(
          document.querySelectorAll(
            'input[name="tags"]:checked'
          ),
          function (input) {
            return input.value;
          }
        );
      }

      /*
       * 提交讨论。
       */
      discussionForm.addEventListener(
        "submit",
        async function (event) {
          event.preventDefault();

          const title = titleInput.value.trim();
          const category = categorySelect.value;
          const tags = getSelectedTags();
          const content = contentInput.value.trim();

          if (title.length < 4) {
            discussionMessage.textContent =
              "标题至少需要 4 个字符。";

            titleInput.focus();
            return;
          }

          if (!category) {
            discussionMessage.textContent =
              "请选择讨论区域。";

            categorySelect.focus();
            return;
          }

          if (tags.length === 0) {
            discussionMessage.textContent =
              "请至少选择一个标签。";

            return;
          }

          if (content.length < 10) {
            discussionMessage.textContent =
              "讨论内容至少需要 10 个字符。";

            contentInput.focus();
            return;
          }

          if (content.length > 10000) {
            discussionMessage.textContent =
              "讨论内容最多 10000 个字符。";

            contentInput.focus();
            return;
          }

          submitButton.disabled = true;
          discussionMessage.textContent =
            "正在提交讨论……";

          try {
            const {
              data: { user },
              error: userError
            } =
              await window.siteSupabase.auth.getUser();

            if (userError) {
              throw userError;
            }

            if (!user) {
              window.location.href = "../login.html";
              return;
            }

            const { data: post, error: postError } =
              await window.siteSupabase
                .from("posts")
                .insert({
                  author_id: user.id,
                  title: title,
                  category: category,
                  tags: tags,
                  content: content
                })
                .select()
                .single();

            if (postError) {
              throw postError;
            }

            discussionMessage.textContent =
              "讨论提交成功，正在返回论坛……";

            window.location.replace(
              `./index.html?post=${encodeURIComponent(
                post.post_id
              )}`
            );
          } catch (error) {
            console.error("提交讨论失败：", error);

            discussionMessage.textContent =
              "提交失败，请稍后再试。";

            submitButton.disabled = false;
          }
        }
      );
    </script>

   
<script>
function renderMarkdown(markdownText) {
  /*
   * 第一步：Markdown 转换成 HTML。
   */
  const unsafeHtml =
    marked.parse(markdownText);

  /*
   * 第二步：清理危险 HTML。
   */
  const safeHtml =
    DOMPurify.sanitize(unsafeHtml, {
      USE_PROFILES: {
        html: true
      }
    });

  return safeHtml;
}

contentInput.addEventListener(
  "input",
  function () {
    const originalText =
      contentInput.value;

    const markdownText =
      originalText.trim();

    const contentLength =
      markdownText.length;

    /*
     * 实时显示字符数量提示。
     */
    if (contentLength === 0) {
      contentLengthMessage.textContent =
        "至少 10 个字符，最多 10000 个字符";

      contentLengthMessage.classList.remove(
        "input-error-message"
      );
    } else if (contentLength < 10) {
      contentLengthMessage.textContent =
        `还需要 ${10 - contentLength} 个字符`;

      contentLengthMessage.classList.add(
        "input-error-message"
      );
    } else {
      contentLengthMessage.textContent =
        `已经输入 ${contentLength} / 10000 个字符`;

      contentLengthMessage.classList.remove(
        "input-error-message"
      );
    }

    /*
     * 实时显示 Markdown 预览。
     */
    if (!markdownText) {
      markdownPreview.replaceChildren();

      const emptyMessage =
        document.createElement("p");

      emptyMessage.className =
        "markdown-preview-empty";

      emptyMessage.textContent =
        "Markdown 预览会显示在这里";

      markdownPreview.append(emptyMessage);
      return;
    }

    try {
      const unsafeHtml =
        marked.parse(originalText);

      const safeHtml =
        DOMPurify.sanitize(unsafeHtml, {
          USE_PROFILES: {
            html: true
          }
        });

      markdownPreview.innerHTML =
        safeHtml;
    } catch (error) {
      console.error(
        "Markdown 预览失败：",
        error
      );

      markdownPreview.textContent =
        "Markdown 预览生成失败。";
    }
  }
);


</script>
  </body>
</html>
