<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>记账本</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="page">
      <h1>记账本</h1>

      <section class="input-box">
        <label>
          1. 选择开支/收入
          <select id="type">
            <option value="income">收入</option>
            <option value="expense">开支</option>
          </select>
        </label>

        <label>
          记到哪里
          <select id="account">
            <option value="short">短期</option>
            <option value="long">长期</option>
            <option value="saving">存款</option>
          </select>
        </label>

        <label>
          2. 填写金额
          <input id="amount" type="number" min="0.01" step="0.01" placeholder="例如：100" />
        </label>

        <label>
          3. 填写原因
          <input id="reason" type="text" placeholder="例如：零花钱" />
        </label>

        <button id="addBtn" type="button">添加</button>
      </section>

      <section class="accounts">
        <div class="account-box" data-account="short">
          <div class="account-title">短期：<span class="money" id="shortMoney">0</span></div>
          <div class="records" id="shortRecords"></div>
          <button class="open-button" type="button">›</button>
        </div>

        <div class="account-box" data-account="long">
          <div class="account-title">长期：<span class="money" id="longMoney">0</span></div>
          <div class="records" id="longRecords"></div>
          <button class="open-button" type="button">›</button>
        </div>

        <div class="account-box" data-account="saving">
          <div class="account-title">存款：<span class="money" id="savingMoney">0</span></div>
          <div class="records" id="savingRecords"></div>
          <button class="open-button" type="button">›</button>
        </div>
      </section>

      <section class="back-to-homepage">
        <a class="addBtn" href="../index.html">返回主页</a>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../site-cloud-helper.js"></script>
    <script>
      const data = {
        short: { money: 0, records: [] },
        long: { money: 0, records: [] },
        saving: { money: 0, records: [] },
      };

      const typeInput = document.getElementById("type");
      const accountInput = document.getElementById("account");
      const amountInput = document.getElementById("amount");
      const reasonInput = document.getElementById("reason");
      const addBtn = document.getElementById("addBtn");

      async function requireLogin() {
        const profile = await siteCloud.currentProfile();
        if (!profile) {
          window.location.href = "../login.html?returnTo=./ledger/";
          return null;
        }

        if (profile.isGuest) {
          alert("游客模式不能保存云端记账数据，请先注册或登录。");
          window.location.href = "../login.html?returnTo=./ledger/";
          return null;
        }

        return profile;
      }

      function resetLocalData() {
        data.short = { money: 0, records: [] };
        data.long = { money: 0, records: [] };
        data.saving = { money: 0, records: [] };
      }

      async function loadCloudRecords() {
        const { data: rows, error } = await siteCloud.list("ledger", { itemType: "record" });

        if (error) {
          alert(error.message);
          return;
        }

        resetLocalData();

        const sortedRows = [...rows].reverse();

        for (const row of sortedRows) {
          const item = row.data;
          const account = item.account;
          const amount = Number(item.amount);

          if (!data[account]) continue;

          if (item.type === "income") {
            data[account].money += amount;
          } else {
            data[account].money -= amount;
          }

          data[account].records.unshift({
            id: row.id,
            type: item.type,
            amount,
            afterMoney: data[account].money,
            reason: item.reason,
          });
        }

        render();
      }

      addBtn.addEventListener("click", async function () {
        const type = typeInput.value;
        const account = accountInput.value;
        const amount = Number(amountInput.value);
        const reason = reasonInput.value.trim();

        if (!amount || amount <= 0) {
          alert("请填写正确的金额");
          return;
        }

        if (!reason) {
          alert("请填写原因");
          return;
        }

        const { error } = await siteCloud.add("ledger", {
          itemType: "record",
          title: reason,
          itemDate: new Date().toISOString().slice(0, 10),
          data: { type, account, amount, reason },
        });

        if (error) {
          alert(error.message);
          return;
        }

        amountInput.value = "";
        reasonInput.value = "";
        await loadCloudRecords();
      });

      document.querySelectorAll(".open-button").forEach(function (button) {
        button.addEventListener("click", function () {
          button.closest(".account-box").classList.toggle("open");
        });
      });

      function render() {
        renderAccount("short", "shortMoney", "shortRecords");
        renderAccount("long", "longMoney", "longRecords");
        renderAccount("saving", "savingMoney", "savingRecords");
      }

      function renderAccount(account, moneyId, recordsId) {
        document.getElementById(moneyId).textContent = data[account].money;

        const recordsBox = document.getElementById(recordsId);
        const records = data[account].records;

        if (records.length === 0) {
          recordsBox.innerHTML = '<div class="empty">还没有记账</div>';
          return;
        }

        recordsBox.innerHTML = records
          .map(function (item) {
            const sign = item.type === "income" ? "+" : "-";
            const className = item.type === "income" ? "plus" : "minus";

            return `
              <div class="record">
                <span class="${className}">
                  ${sign}${item.amount}（${item.afterMoney}）
                </span>
                ${item.reason}
              </div>
            `;
          })
          .join("");
      }

      requireLogin().then(function (profile) {
        if (!profile) return;
        loadCloudRecords();
      });
    </script>
  </body>
</html>
