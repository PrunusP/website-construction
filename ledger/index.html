<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>记账本</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="page">
      <h1>记账本</h1>

      <section class="input-box">
        <label>
          1. 选择开支/收入
          <select id="type">
            <option value="income">收入</option>
            <option value="expense">开支</option>
          </select>
        </label>

        <label>
          记到哪里
          <select id="account">
            <option value="short">短期</option>
            <option value="long">长期</option>
            <option value="saving">存款</option>
          </select>
        </label>

        <label>
          2. 填写金额
          <input id="amount" type="number" min="0.01" step="0.01" placeholder="例如：100" />
        </label>

        <label>
          3. 填写原因
          <input id="reason" type="text" placeholder="例如：零花钱" />
        </label>

        <button id="addBtn">添加</button>
      </section>

      <section class="accounts">
        <div class="account-box" data-account="short">
          <div class="account-title">短期：<span class="money" id="shortMoney">0</span></div>
          <div class="records" id="shortRecords"></div>
          <button class="open-button">›</button>
        </div>

        <div class="account-box" data-account="long">
          <div class="account-title">长期：<span class="money" id="longMoney">0</span></div>
          <div class="records" id="longRecords"></div>
          <button class="open-button">›</button>
        </div>

        <div class="account-box" data-account="saving">
          <div class="account-title">存款：<span class="money" id="savingMoney">0</span></div>
          <div class="records" id="savingRecords"></div>
          <button class="open-button">›</button>
        </div>
      </section>

      <section class="back-to-homepage">
        <a class="addBtn" href="../index.html">返回主页</a>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../site-cloud-helper.js"></script>
    <script>
      const data = {
        short: { money: 0, records: [] },
        long: { money: 0, records: [] },
        saving: { money: 0, records: [] },
      };

      const typeInput = document.getElementById("type");
      const accountInput = document.getElementById("account");
      const amountInput = document.getElementById("amount");
      const reasonInput = document.getElementById("reason");
      const addBtn = document.getElementById("addBtn");

        const user = await siteCloud.currentUser();
        if (!user) {
          window.location.href = "../login.html";
          return null;
        }
        return user;
      }
