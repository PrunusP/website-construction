<!doctype html>
<html lang="zh-CN">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>你好</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body class="home-page">


      <div id="loggedInView" hidden>
          <div class="home-top-actions">
          <button id="logoutButton" type="button">
            Logout
          </button>
        </div>

          <main class="home-shell" aria-label="首页">
          <section class="hello-panel">
            <h1>你好 </h1>
            <nav class="home-actions" aria-label="功能入口">
              <a class="home-card" href="./forum/index.html">
                <span>论坛</span>
              </a>
            </nav>
          </section>

        </main>
      </div>
  
    
      <div id="loggedOutView" hidden>
        <div class="home-top-actions">
        <a href="./login.html" aria-label="Login" title="Login">
          Login
        </a>
      </div>

        <main class="home-shell" aria-label ="首页">
          <h2>Seems like there is nothing here.</h2>
        </main>
      </div>
    

 

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./site-cloud-helper.js"></script>

<script>

  //判断是否登录

  const loggedInView = document.getElementById("loggedInView");
  const loggedOutView = document.getElementById("loggedOutView");
  const logoutButton = document.getElementById("logoutButton");

  async function renderHomePage() {
    const { data, error } =
      await window.siteSupabase.auth.getSession();

    if (error) {
      console.error("读取登录状态失败：", error);
    }

    const isLoggedIn = Boolean(data?.session);

    if (isLoggedIn) {
      loggedInView.hidden = false;
    } 
    else {
      loggedOutView.hidden = false;
    }
  }

  logoutButton.addEventListener("click", async function () {
    logoutButton.disabled = true;

    const { error } =
      await window.siteSupabase.auth.signOut({
        scope: "local"
      });

    if (error) {
      console.error("退出登录失败：", error);
      logoutButton.disabled = false;
      return;
    }

    window.location.reload();
  });

  renderHomePage();
</script>

 </body>
</html>
