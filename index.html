    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./site-cloud-helper.js"></script>
    <script>
      async function checkEntryPermission() {
        const isGuest = localStorage.getItem("site_guest_mode") === "yes";
        if (isGuest) return;
    
        const user = await siteCloud.currentUser();
        if (user) return;
    
        window.location.href = "./login.html?returnTo=./index.html";
      }
  
      checkEntryPermission();
    </script>
