<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>注册</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <main class="login-shell">
      <section class="login-panel">
        <h1>注册账号</h1>

        <form class="login-form" id="registerForm">
          <label for="usernameInput">
            用户名

            <input
              id="usernameInput"
              name="username"
              type="text"
              autocomplete="username"
              minlength="2"
              maxlength="24"
              placeholder="2～24 个字符，不能包含空格"
              required
            />
          </label>
          <label for="emailInput">
            邮箱
            <input
              id="emailInput"
              name="email"
              type="email"
              autocomplete="email"
              maxlength="254"
              placeholder="example@email.com"
              required
            />
          </label>

          <label for="passwordInput">
            密码
            <input
              id="passwordInput"
              name="password"
              type="password"
              autocomplete="new-password"
              minlength="6"
              placeholder="至少 6 位"
              required
            />
          </label>

          <label for="confirmPasswordInput">
            确认密码
            <input
              id="confirmPasswordInput"
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="6"
              placeholder="再次输入密码"
              required
            />
          </label>

          <p
            id="registerMessage"
            role="status"
            aria-live="polite"
          ></p>

          <div class="login-actions">
            <button
              class="login-button primary"
              id="registerButton"
              type="submit"
            >
              注册
            </button>

            <a
              href="./login.html"
              aria-label="返回登录"
              title="返回登录"
            >
              已有账号？登录
            </a>
          </div>
        </form>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./site-cloud-helper.js"></script>

    <script>
  const registerForm =
    document.getElementById("registerForm");

  const usernameInput =
    document.getElementById("usernameInput");

  const emailInput =
    document.getElementById("emailInput");

  const passwordInput =
    document.getElementById("passwordInput");

  const confirmPasswordInput =
    document.getElementById(
      "confirmPasswordInput"
    );

  const registerButton =
    document.getElementById("registerButton");

  const registerMessage =
    document.getElementById(
      "registerMessage"
    );

  registerForm.addEventListener(
    "submit",
    async function (event) {
      event.preventDefault();

      const username =
        usernameInput.value.trim();

      const email =
        emailInput.value.trim();

      const password =
        passwordInput.value;

      const confirmPassword =
        confirmPasswordInput.value;

      registerMessage.textContent = "";

      /*
       * 检查用户名。
       */
      if (
        username.length < 2 ||
        username.length > 24
      ) {
        if (username.length === 1) {
          registerMessage.textContent =
            "用户名至少需要 2 个字符。（是的，我们暂时不允许单字 ID 😂）";
        } else {
          registerMessage.textContent =
            "用户名长度必须为 2～24 个字符。";
        }

        usernameInput.focus();
        return;
      }

      /*
       * 只允许：
       * - 各种语言的文字
       * - 数字
       * - 下划线
       * - 连字符
       */
      const usernamePattern =
        /^[\p{L}\p{N}_-]+$/u;

      if (!usernamePattern.test(username)) {
        registerMessage.textContent =
          "用户名只能包含文字、数字、下划线和连字符。";

        usernameInput.focus();
        return;
      }

      /*
       * 检查邮箱。
       */
      if (!email) {
        registerMessage.textContent =
          "请输入邮箱地址。";

        emailInput.focus();
        return;
      }

      if (!emailInput.validity.valid) {
        registerMessage.textContent =
          "请输入有效的邮箱地址。";

        emailInput.focus();
        return;
      }

      /*
       * 检查密码。
       */
      if (password.length < 6) {
        registerMessage.textContent =
          "密码不能少于 6 位。";

        passwordInput.focus();
        return;
      }

      if (password !== confirmPassword) {
        registerMessage.textContent =
          "两次输入的密码不一致。";

        confirmPasswordInput.focus();
        return;
      }

      registerButton.disabled = true;
      registerMessage.textContent =
        "正在检查用户名……";

      try {
        /*
         * 检查用户名是否已被使用。
         */
        const {
          count,
          error: usernameCheckError
        } =
          await window.siteSupabase
            .from("profiles")
            .select("id", {
              count: "exact",
              head: true
            })
            .ilike("username", username);

        if (usernameCheckError) {
          throw usernameCheckError;
        }

        if ((count ?? 0) > 0) {
          registerMessage.textContent =
            "这个用户名已经被使用，请换一个。";

          usernameInput.focus();
          registerButton.disabled = false;
          return;
        }

        registerMessage.textContent =
          "正在创建账号……";

        /*
         * 注册 Supabase 用户，
         * 同时将用户名放入 user metadata。
         */
        const { data, error } =
          await window.siteSupabase.auth.signUp({
            email: email,
            password: password,

            options: {
              data: {
                username: username
              },

              emailRedirectTo:
                "https://prunuses.site/index.html"
            }
          });

        if (error) {
          throw error;
        }

        /*
         * 关闭邮箱确认时，
         * 注册后会直接获得 session。
         */
        if (data.session) {
          registerMessage.textContent =
            "注册成功，正在进入首页……";

          window.location.replace(
            "./index.html"
          );

          return;
        }

        /*
         * 开启邮箱确认时，
         * 用户需要点击验证邮件。
         */
        registerMessage.textContent =
          "注册申请已提交，请前往邮箱完成验证。";

        registerForm.reset();
      } catch (error) {
        console.error("注册失败：", error);

        registerMessage.textContent =
          getRegisterErrorMessage(error);

        registerButton.disabled = false;
      }
    }
  );

  function getRegisterErrorMessage(error) {
    const message =
      String(
        error?.message || ""
      ).toLowerCase();

    if (
      message.includes("already registered") ||
      message.includes("already exists")
    ) {
      return "这个邮箱或用户名可能已经注册。";
    }

    if (
      message.includes("duplicate") ||
      message.includes("unique")
    ) {
      return "这个用户名已经被使用，请换一个。";
    }

    if (
      message.includes("database error")
    ) {
      return "无法创建用户资料，请检查用户名是否已被使用。";
    }

    if (message.includes("password")) {
      return "密码不符合安全要求。";
    }

    if (
      message.includes("email") &&
      message.includes("invalid")
    ) {
      return "请输入有效的邮箱地址。";
    }

    if (
      message.includes("rate") ||
      message.includes("too many")
    ) {
      return "请求次数过多，请稍后再试。";
    }

    return "注册失败，请稍后重试。";
  }
</script>
  </body>
</html>
