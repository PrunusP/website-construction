<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>清账本</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">个人记账本</p>
          <h1>清账本</h1>
        </div>
        <div class="month-switcher" aria-label="月份筛选">
          <a class="ghost-link" href="./index.html">首页</a>
          <button class="icon-button" id="prevMonth" type="button" aria-label="上个月" title="上个月">‹</button>
          <input id="monthFilter" type="month" />
          <button class="icon-button" id="nextMonth" type="button" aria-label="下个月" title="下个月">›</button>
        </div>
      </header>

      <main class="layout">
        <section class="summary-band" aria-label="月度汇总">
          <article class="metric">
            <span>本月结余</span>
            <strong id="balanceValue">¥0.00</strong>
          </article>
          <article class="metric income">
            <span>收入</span>
            <strong id="incomeValue">¥0.00</strong>
          </article>
          <article class="metric expense">
            <span>支出</span>
            <strong id="expenseValue">¥0.00</strong>
          </article>
          <article class="metric">
            <span>记录数</span>
            <strong id="countValue">0</strong>
          </article>
        </section>

        <section class="entry-panel" aria-label="新增账目">
          <div class="section-heading">
            <h2>新增一笔</h2>
            <button id="exportButton" class="ghost-button" type="button" title="导出 CSV">导出</button>
          </div>
          <form id="entryForm" class="entry-form">
            <div class="type-toggle" role="group" aria-label="收支类型">
              <label>
                <input type="radio" name="type" value="expense" checked />
                <span>支出</span>
              </label>
              <label>
                <input type="radio" name="type" value="income" />
                <span>收入</span>
              </label>
            </div>

            <label for="amountInput">
              金额
              <input id="amountInput" type="number" min="0.01" step="0.01" placeholder="128.00" required />
            </label>

            <label for="categoryInput">
              分类
              <select id="categoryInput" required></select>
            </label>

            <label for="dateInput">
              日期
              <input id="dateInput" type="date" required />
            </label>

            <label class="wide" for="noteInput">
              备注
              <input id="noteInput" type="text" maxlength="48" placeholder="午餐、工资、房租..." />
            </label>

            <button class="primary-button wide" type="submit">保存</button>
          </form>
        </section>

        <section class="insights-panel" aria-label="分类统计">
          <div class="section-heading">
            <h2>支出分类</h2>
            <span id="topCategory">暂无</span>
          </div>
          <div id="categoryBars" class="category-bars"></div>
        </section>

        <section class="records-panel" aria-label="账目列表">
          <div class="section-heading">
            <h2>明细</h2>
            <div class="filters">
              <select id="typeFilter" aria-label="类型筛选">
                <option value="all">全部</option>
                <option value="expense">支出</option>
                <option value="income">收入</option>
              </select>
              <button id="clearButton" class="ghost-button danger" type="button">清空</button>
            </div>
          </div>
          <div id="emptyState" class="empty-state">
            <strong>还没有账目</strong>
            <span>添加第一笔后，这里会显示明细和统计。</span>
          </div>
          <ul id="recordList" class="record-list"></ul>
        </section>
      </main>
    </div>

    <template id="recordTemplate">
      <li class="record-item">
        <div class="record-main">
          <span class="record-category"></span>
          <strong class="record-note"></strong>
          <small class="record-date"></small>
        </div>
        <div class="record-side">
          <strong class="record-amount"></strong>
          <button class="delete-button" type="button" aria-label="删除" title="删除">×</button>
        </div>
      </li>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
