<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人页面</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .profile-shell {
        width: min(560px, calc(100% - 32px));
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0 auto;
      }

      .profile-panel {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow);
        padding: 22px;
      }

      .profile-avatar {
        display: grid;
        place-items: center;
        width: 78px;
        height: 78px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        margin-bottom: 16px;
      }

      .profile-form,
      .profile-form label,
      .profile-actions {
        display: grid;
        gap: 12px;
      }

      .profile-form label {
        gap: 7px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .profile-actions {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .profile-button {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: var(--ink);
        padding: 0 14px;
      }

      .profile-button.primary {
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
        font-weight: 800;
      }

      .profile-status {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="profile-shell">
      <section class="profile-panel">
        <div class="profile-avatar" aria-hidden="true">
          <svg width="42" height="42" viewBox="0 0 40 40">
            <circle cx="20" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="3" />
            <path d="M20 15v12M10 21h20M20 27l-8 9M20 27l8 9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          </svg>
        </div>
        <h1>个人页面</h1>
        <form class="profile-form">
          <label for="usernameInput">
            用户名
            <input id="usernameInput" type="text" maxlength="24" />
          </label>
          <p class="profile-status" id="profileStatus"></p>
          <div class="profile-actions">
            <button class="profile-button primary" id="saveButton" type="button">保存用户名</button>
            <button class="profile-button" id="logoutButton" type="button">退出登录</button>
            <a class="profile-button" href="../index.html">返回主页</a>
            <a class="profile-button" href="./login.html">登录页面</a>
          </div>
        </form>
      </section>
    </main>
