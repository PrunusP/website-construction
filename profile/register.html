<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录</title>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      .login-shell {
        width: min(480px, calc(100% - 32px));
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0 auto;
      }

      .login-panel {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow);
        padding: 22px;
      }

      .login-form,
      .login-form label {
        display: grid;
        gap: 12px;
      }

      .login-form label {
        gap: 7px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .login-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .login-button {
        min-height: 42px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--paper);
        color: var(--ink);
        padding: 0 14px;
      }

      .login-button.primary {
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
        font-weight: 800;
      }

      .login-status {
        min-height: 22px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <section class="login-panel">
        <h1>注册</h1>
        <form class="login-form" id="loginForm">
          <label for="usernameInput">
            用户名
            <input id="usernameInput" type="text" autocomplete="username" maxlength="24"/>
          </label>
          <label for="emailInput">
            邮箱
            <input id="emailInput" type="email" autocomplete="email" />
          </label>
          <label for="passwordInput">
            密码
            <input id="passwordInput" type="password" autocomplete="current-password" required minlength="6" placeholder="至少 6 位" />
          </label>
          
          <div class="login-actions">
            <button class="login-button primary" id="registerButton" type="button">注册</button>
            <a class="login-button" type="button" href="./login.html">登录</a>
          </div>
          <p class="login-status" id="loginStatus">第一次使用请先注册。</p>
        </form>
      </section>
    </main>

   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../site-cloud-helper.js"></script>
    <script>
      const usernameInput = document.querySelector("#usernameInput");
      const emailInput = document.querySelector("#emailInput");
      const passwordInput = document.querySelector("#passwordInput");
      const loginStatus = document.querySelector("#loginStatus");
    </script>

    <script>
      document.querySelector("#registerButton").addEventListener("click", async () => {
        const username = document.querySelector("#usernameInput").value.trim();
        const email = document.querySelector("#emailInput").value.trim();
        const password = document.querySelector("#passwordInput").value;
    
        if (!username || !email || !password) {
          alert("注册需要填写用户名、邮箱和密码。");
          return;
        }
    
        const { error } = await siteCloud.register(email, password, username);
    
        if (error) {
          alert(error.message);
          return;
        }
    
        alert("注册成功，请登录。");
      });
    </script>
  </body>
</html>
